buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.0.1"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
}

tasks.register('clean', Delete) {
    delete = layout.buildDirectory
}
